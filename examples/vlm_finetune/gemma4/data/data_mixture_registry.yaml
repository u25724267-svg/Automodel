schema_version: 1
updated: 2026-09-01
scope: >-
  Full and authoritative Gemma 4 E2B African-language training runs evidenced by
  version-controlled reports or preserved local checkpoints. Smoke and short
  qualification runs are excluded except for explicitly listed superseded runs.

token_metrics:
  prepared_text_tokens: >-
    Gemma processor tokens stored as _text_tokens before the causal shift. This
    is the allocation metric used in every language-task table below.
  model_input_tokens: >-
    Tokens presented after the VLM causal shift removes one token per record.
  supervised_label_tokens: Tokens contributing to the answer-only loss.
  packed_training_tokens: Non-padding tokens actually processed by training.

tasks:
  instruction: General instruction following, summarization, and mapped multitask prompts.
  qa: Open-ended or extractive question answering.
  translation: Machine translation, including directed language pairs.
  classification: Sentiment, topic, hate-speech, and related classification.
  ner: Named entity recognition.

languages:
  amh: Amharic
  hau: Hausa
  ibo: Igbo
  kin: Kinyarwanda
  lug: Luganda
  sna: Shona
  som: Somali
  sot: Sesotho
  swa: Swahili (Inkuba code)
  swh: Swahili
  twi: Twi
  wol: Wolof
  xho: isiXhosa
  yor: Yoruba
  zul: isiZulu

