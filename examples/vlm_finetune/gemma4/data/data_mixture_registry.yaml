  k6_p2_v2:
    status: verified_local_summary
    policy: p2_quality_constrained
    summary_sha256: ac39fc5d90a2f53869fb790334472b2f9ce36482a0a82dbce226afd6aad4331c
    train_records: 153273
    prepared_text_tokens: 31348990
    tasks: [instruction, qa, translation, classification, ner]
    selection:
      - Allocate by capped examples-proportional sampling with temperature 2.
      - Apply quality weights, a 50 percent default source-family cap, and a 25 percent AfriInstruct anchor.
      - Reallocate measured shortfalls and repeat only within the four-appearance cap.
      - Round pool allocations by largest remainder and select by stable digest order.
    filtering:
      - Reject malformed, out-of-scope, benchmark-matching, exact cross-pool duplicate, unsupervised, and overlength records.
      - Select validation only from unique records unused by training.
    preprocessing:
      - Normalize source-specific schemas to conversations plus language, task, source, direction, and entity metadata.
      - Count prompt, supervised label, and prepared text tokens with the pinned Gemma processor.
      - Balance AfriHate labels within the same repetition cap.
