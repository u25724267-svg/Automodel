  inkuba_clean_v2:
    status: external_summary_unavailable
    languages: [hau, swa, xho, yor, zul]
    tasks: [mmt, sentiment, topic, ner, pos]
    task_weights: {mmt: 0.50, sentiment: 0.15, topic: 0.15, ner: 0.10, pos: 0.10}
    planned_train_tokens: 100000000
    language_task_tokens: null
    missing_detail: >-
      The external profile and summary are not present on this host. The exact
      realized language-task allocation is therefore unavailable.
    selection:
      - Divide the train-token budget equally across five languages.
      - Cap machine translation at 50 percent within each language.
      - Give each observed source an equal share of its task budget.
      - Select deterministically from profiled train and development partitions.
    filtering:
      - Reject AfriQA and SIB-200 by source.
      - Reject benchmark-blocklist matches, unsupported tasks, malformed records, and script failures.
      - Exclude QA because the available Inkuba QA source is AfriQA.
    preprocessing:
      - Normalize records to user/assistant conversations with language, task, source, and provenance.
      - Profile exact Gemma token lengths by partition, language, task, and source.
      - Materialize bounded shards with exact _text_tokens.
    provenance:
      - ../README_inkuba_afriinstruct_v2.md
      - ../../../../../tools/prepare_inkuba.py

