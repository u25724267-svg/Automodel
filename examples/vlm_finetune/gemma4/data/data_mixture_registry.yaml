    language_task_tokens: null
    missing_detail: >-
      The external summary and prepared shards are not present on this host, so
      exact prepared tokens by language and task cannot be reconstructed.
    selection:
      - Complete train split with no language, task, or source filters.
      - Remove malformed records and exact duplicate instruction/output pairs.
      - Assign validation by deterministic content hash with seed 42 and fraction 0.01.
    filtering:
      malformed_records: 0
      exact_duplicates_removed: 153415
      benchmark_blocklist: false
      limitation: Near-duplicate and templated examples may remain.
    preprocessing:
      - Normalize instruction, output, language, task, and source fields.
      - Convert each pair to user/assistant conversation schema.
      - Partition bounded JSONL shards by language and task.
      - Add exact Gemma _text_tokens with scripts/precompute_tokens.py.
