# Independent K10 P2 rank-16 ablation using NVIDIA's Gemma 4 E2B two-epoch
# LoRA and derived cosine learning-rate policy. Validation runs in-process to
# prevent forked validation workers from duplicating the training process RAM.

recipe: FinetuneRecipeForVLM

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 200
  val_every_steps: 200
  log_remote_every_steps: 10
  loss_average_window_steps: 50
  gc_every_steps: 50
  num_epochs: 2
  save_checkpoint_every_epoch: false

dist_env:
  backend: nccl
  timeout_minutes: 30

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: google/gemma-4-E2B-it
  revision: 3e22461f65e89153144f8adb70e3b8c2cc9845a7
  torch_dtype: torch.bfloat16
  attn_implementation: sdpa
  use_liger_kernel: false
  use_sdpa_patching: false
  text_config:
    use_cache: false
    output_hidden_states: true

processor:
  revision: 3e22461f65e89153144f8adb70e3b8c2cc9845a7
  padding_side: right

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  match_all_linear: false
  exclude_modules:
    - "*vision_tower*"
    - "*vision*"
    - "*visual*"
    - "*image_encoder*"
    - "*audio*"
    - "*lm_head*"
  dim: 16
  alpha: 32
  dropout: 0.0
  use_triton: true

checkpoint:
  enabled: true
  checkpoint_dir: /checkpoints/gemma4-e2b-k10/p2-r16-2ep-nvidia-lr-v1
  model_save_format: safetensors
  save_consolidated: false

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  pp_size: 1
  sequence_parallel: false
  activation_checkpointing: false

freeze_config:
  freeze_embeddings: true
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy
  logit_softcapping: 30.0
  reduction: sum

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_meta_dataset
  path_or_dataset: /data/gemma4-k10/mixture-p2-v1/train_meta.json
  split: train
  truncate: false
  inject_fake_images: false

packed_sequence:
  pretokenize: true
  max_length: 4096
  pack_size: 4096
  collate_max_length: 4096
  packing_ratio: 0.9
  drop_long_samples: true

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 4
  persistent_workers: true
  pin_memory: true
  shuffle: true
  drop_last: true

validation_dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_meta_dataset
  path_or_dataset: /data/gemma4-k10/mixture-p2-v1/validation_meta.json
  split: validation

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  persistent_workers: false
  pin_memory: true

optimizer:
  _target_: torch.optim.AdamW
  lr: 2.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]
  eps: 1.0e-8

lr_scheduler:
  lr_decay_style: cosine

clip_grad_norm:
  max_norm: 1.0

wandb:
  enable: false
  entity: ${WANDB_ENTITY}
  project: ${WANDB_PROJECT}
  name: gemma4-e2b-k10-p2-r16-2ep-nvidia-lr-v1
  group: gemma4-e2b-k10-p2-r16-2ep-nvidia-lr
  tags: [gemma4-e2b, k10, p2-quality-constrained, text-only, lora-r16, two-epochs, nvidia-lr, memory-qualified, ablation]
  notes: Independent K10 P2 rank-16 ablation using NVIDIA's two-epoch LR policy and in-process validation.
  dir: ${WANDB_DIR}