recipe: FinetuneRecipeForVLM
step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 100
  val_every_steps: 100
  log_remote_every_steps: 10
  loss_average_window_steps: 50
  gc_every_steps: 50
  max_steps: 1000
  num_epochs: null
  save_checkpoint_every_epoch: false
dist_env:
  backend: nccl
  timeout_minutes: 30
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true
model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: google/gemma-4-E2B-it
  torch_dtype: torch.bfloat16
  attn_implementation: sdpa
  use_liger_kernel: false
  use_sdpa_patching: false
  text_config:
    use_cache: false
    output_hidden_states: true
processor:
  padding_side: right
peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  match_all_linear: false
  exclude_modules:
  - '*vision_tower*'
  - '*vision*'
  - '*visual*'
  - '*image_encoder*'
  - '*audio*'
  - '*lm_head*'
  dim: 32
  alpha: 32
  dropout: 0.05
  use_triton: true
checkpoint:
  enabled: true
  checkpoint_dir: ${K6_CHECKPOINT_DIR,vlm_checkpoints/gemma4_e2b_k6_p2_peft}
  model_save_format: safetensors
  save_consolidated: false
distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  pp_size: 1
  sequence_parallel: false
  activation_checkpointing: false
freeze_config:
  freeze_embeddings: true
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false
loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy
  logit_softcapping: 30.0
  reduction: sum
dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_meta_dataset
  path_or_dataset: ${K6_DATA_DIR,./data/gemma4-k6/mixture-p2-v2}/train_meta.json
  split: train
  truncate: false
  inject_fake_images: false
packed_sequence:
  pretokenize: true
  max_length: 4096
  pack_size: 4096
  collate_max_length: 4096
  packing_ratio: 0.9
  drop_long_samples: true
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 4
  persistent_workers: true
  pin_memory: true
  shuffle: true
  drop_last: true
validation_dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_meta_dataset
  path_or_dataset: ${K6_DATA_DIR,./data/gemma4-k6/mixture-p2-v2}/validation_meta.json
  split: validation
validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 2
  persistent_workers: true
  pin_memory: true
optimizer:
  _target_: torch.optim.AdamW
  lr: 5.0e-05
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 50
  min_lr: 5.0e-06
clip_grad_norm:
  max_norm: 1.0
wandb:
  enable: false
  entity: dsfsi
  project: gemma4-african-instruction
  name: gemma4-e2b-k6-p2-r32-1k-v1
  group: gemma4-e2b-k6-p2-r32
  tags:
  - gemma4-e2b
  - k6
  - p2-quality-constrained
  - text-only
  - lora-r32
  - benchmark-safe
  dir: ${K6_WANDB_DIR,./wandb}
